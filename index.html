<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pacing Tracker</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pacing">
  
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --primary: #2c3e50;
      --accent: #3498db;
      --success: #2ecc71;
      --text: #333333;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 16px;
      padding-bottom: 40px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      color: var(--primary);
      text-align: center;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--primary);
      border-bottom: 2px solid var(--bg-color);
      padding-bottom: 6px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 4px;
      color: #666;
    }

    input, textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fafafa;
      outline: none;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row .form-group {
      flex: 1;
    }

    .status-badge {
      display: block;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 8px;
      text-align: center;
    }

    .status-ideal { background: #e8f8f5; color: #117a65; }
    .status-warn { background: #fef9e7; color: #b7950b; }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      margin-top: 12px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #2c3e50;
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Pacing Tracker (Neon Cloud)</h1>

    <div class="card">
      <div class="card-title">Morgen-Vitalwerte</div>
      
      <div class="form-group">
        <label for="datum">Datum</label>
        <input type="date" id="datum" onchange="loadFromNeon()">
      </div>

      <div class="row">
        <div class="form-group">
          <label for="puls">Morgenpuls (bpm)</label>
          <input type="number" id="puls" placeholder="z.B. 54" min="30" max="200" oninput="evaluatePuls(this.value)">
        </div>
        <div class="form-group">
          <label for="hrv">HRV (ms)</label>
          <input type="number" id="hrv" placeholder="z.B. 45">
        </div>
      </div>

      <div id="pulsStatus" class="status-badge status-ideal" style="display:none;"></div>
    </div>

    <div class="card">
      <div class="card-title">Pacing &amp; Befinden</div>

      <div class="form-group">
        <label for="energieLevel">Energie-Level (1–10)</label>
        <input type="number" id="energieLevel" min="1" max="10" placeholder="z.B. 6">
      </div>

      <div class="form-group">
        <label for="notizen">Notizen / Aktivitäten / Symptome</label>
        <textarea id="notizen" rows="4" placeholder="Wie geht es dir heute?"></textarea>
      </div>

      <button class="btn" onclick="saveToNeon()">In Cloud Speichern</button>
    </div>
  </div>

  <div id="toast" class="toast">In Neon gespeichert!</div>

  <script>
    const fieldIds = ['puls', 'hrv', 'energieLevel', 'notizen'];

    window.addEventListener('load', () => {
      document.getElementById('datum').valueAsDate = new Date();
      loadFromNeon();
    });

    // WERTEN AUS NEON CLOUD LADEN
    async function loadFromNeon() {
      const datum = document.getElementById('datum').value;
      if (!datum) return;

      showToast("Lade Daten...");
      try {
        const res = await fetch(`/api/pacing?datum=${datum}`);
        if (res.ok) {
          const data = await res.json();
          if (data) {
            document.getElementById('puls').value = data.puls || '';
            document.getElementById('hrv').value = data.hrv || '';
            document.getElementById('energieLevel').value = data.energie || '';
            document.getElementById('notizen').value = data.notizen || '';
            evaluatePuls(data.puls);
            showToast("Daten geladen");
          } else {
            // Keine Daten für diesen Tag -> Felder leeren
            fieldIds.forEach(id => document.getElementById(id).value = '');
            evaluatePuls(null);
            showToast("Neuer Tag");
          }
        }
      } catch (err) {
        console.error("Fehler beim Laden:", err);
        showToast("Fehler beim Laden");
      }
    }

    // WERTE IN NEON CLOUD SPEICHERN
    async function saveToNeon() {
      const datum = document.getElementById('datum').value;
      if (!datum) return alert("Bitte Datum wählen!");

      const payload = {
        datum: datum,
        puls: document.getElementById('puls').value,
        hrv: document.getElementById('hrv').value,
        energieLevel: document.getElementById('energieLevel').value,
        notizen: document.getElementById('notizen').value
      };

      showToast("Speichere...");

      try {
        const res = await fetch('/api/pacing', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          showToast("Dauerhaft in Neon gespeichert! ✓");
        } else {
          alert("Fehler beim Speichern in Neon.");
        }
      } catch (err) {
        console.error("Speicherfehler:", err);
        alert("Netzwerkfehler beim Speichern.");
      }
    }

    function evaluatePuls(pulsVal) {
      const badge = document.getElementById('pulsStatus');
      if (!pulsVal || isNaN(pulsVal) || pulsVal === "") {
        badge.style.display = 'none';
        return;
      }

      const p = parseFloat(pulsVal);
      badge.style.display = 'block';

      if (p >= 50 && p <= 59) {
        badge.className = 'status-badge status-ideal';
        badge.textContent = `Puls ${p} bpm: Idealbereich (50–59 bpm) – Keine Abweichung`;
      } else if (p > 59) {
        const diff = Math.round((p - 59) * 10) / 10;
        badge.className = 'status-badge status-warn';
        badge.textContent = `Puls ${p} bpm: +${diff} bpm über dem Idealbereich`;
      } else {
        const diff = Math.round((50 - p) * 10) / 10;
        badge.className = 'status-badge status-warn';
        badge.textContent = `Puls ${p} bpm: -${diff} bpm unter dem Idealbereich`;
      }
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 1800);
    }
  </script>
</body>
</html>
