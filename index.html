<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacing Rechner</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 480px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    h2 { margin-top: 0; color: var(--accent); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 0.9em; color: var(--text-muted); }
    input, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      font-size: 1em;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
    .status { margin-top: 10px; font-size: 0.85em; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>🌅 Morgen-Check</h2>
    <form id="morgenForm">
      <div class="form-group">
        <label for="datum">Datum</label>
        <input type="date" id="datum" required>
      </div>
      <div class="form-group">
        <label for="puls">Ruhepuls (BPM)</label>
        <input type="number" id="puls" placeholder="z.B. 65">
      </div>
      <div class="form-group">
        <label for="hrv">HRV (ms)</label>
        <input type="number" id="hrv" placeholder="z.B. 45">
      </div>
      <div class="form-group">
        <label for="schlaf">Schlafqualität (1-10)</label>
        <input type="number" id="schlaf" min="1" max="10" placeholder="z.B. 7">
      </div>
      <div class="form-group">
        <label for="energie">Energie-Level (1-10)</label>
        <input type="number" id="energie" min="1" max="10" placeholder="z.B. 6">
      </div>
      <div class="form-group">
        <label for="notizen">Notizen / Symptome</label>
        <textarea id="notizen" rows="3" placeholder="Wie geht es dir heute?"></textarea>
      </div>
      <button type="submit" id="saveBtn">In Cloud Speichern</button>
      <div class="status" id="statusMsg"></div>
    </form>
  </div>
</div>

<script>
  // Heutiges Datum als Standard setzen
  const heute = new Date().toISOString().split('T')[0];
  document.getElementById('datum').value = heute;

  // Daten abrufen
  async function datenLaden() {
    const datum = document.getElementById('datum').value;
    const statusMsg = document.getElementById('statusMsg');
    statusMsg.innerText = "Lade Daten...";
    
    try {
      const res = await fetch(`/api/pacing?datum=${datum}&t=${Date.now()}`);
      const data = await res.json();
      
      if (data) {
        document.getElementById('puls').value = data.puls ?? '';
        document.getElementById('hrv').value = data.hrv ?? '';
        document.getElementById('schlaf').value = data.schlaf ?? '';
        document.getElementById('energie').value = data.energie ?? '';
        document.getElementById('notizen').value = data.notizen ?? '';
        statusMsg.innerText = "✅ Aus Cloud geladen";
        statusMsg.style.color = "#4ade80";
      } else {
        document.getElementById('puls').value = '';
        document.getElementById('hrv').value = '';
        document.getElementById('schlaf').value = '';
        document.getElementById('energie').value = '';
        document.getElementById('notizen').value = '';
        statusMsg.innerText = "Keine Daten für dieses Datum.";
        statusMsg.style.color = "#94a3b8";
      }
    } catch (e) {
      statusMsg.innerText = "Fehler beim Laden!";
      statusMsg.style.color = "#f87171";
    }
  }

  // Bei Datumsänderung neu laden
  document.getElementById('datum').addEventListener('change', datenLaden);

  // Formular absenden
  document.getElementById('morgenForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const saveBtn = document.getElementById('saveBtn');
    const statusMsg = document.getElementById('statusMsg');
    
    saveBtn.disabled = true;
    statusMsg.innerText = "Speichere in Cloud...";
    statusMsg.style.color = "#38bdf8";

    const payload = {
      datum: document.getElementById('datum').value,
      puls: document.getElementById('puls').value,
      hrv: document.getElementById('hrv').value,
      schlaf: document.getElementById('schlaf').value,
      energie: document.getElementById('energie').value,
      notizen: document.getElementById('notizen').value
    };

    try {
      const res = await fetch('/api/pacing', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      if (res.ok) {
        statusMsg.innerText = "✨ In Cloud gespeichert!";
        statusMsg.style.color = "#4ade80";
      } else {
        throw new Error('Speichern fehlgeschlagen');
      }
    } catch (err) {
      statusMsg.innerText = "❌ Fehler beim Speichern!";
      statusMsg.style.color = "#f87171";
    } finally {
      saveBtn.disabled = false;
    }
  });

  // Neuladen bei App-Wechsel / Öffnen
  window.addEventListener('pageshow', datenLaden);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') datenLaden();
  });

  datenLaden();
</script>

</body>
</html>
